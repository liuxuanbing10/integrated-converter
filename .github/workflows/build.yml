name: build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  windows-msvc:
    name: windows / MSVC / Qt 6.12
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.12.0
        # aqtinstall 3.3.0 cannot parse the new per-arch Windows repo layout
        # used by Qt >= 6.11 (miurahr/aqtinstall#959); the fix is merged on
        # master but unreleased. Install from git until the next release.
        # Keep this version in sync with the local toolchain: Qt 6.12.0.
        run: |
          pip install "git+https://github.com/miurahr/aqtinstall.git"
          python -m aqt install-qt windows desktop 6.12.0 win64_msvc2022_64 --outputdir "${{ github.workspace }}\Qt"
          # NOTE: with the new per-arch repo layout aqt installs into
          # Qt/6.12.0/msvc2022_64 (no win64_ prefix) for Qt >= 6.11.
          echo "${{ github.workspace }}\Qt\6.12.0\msvc2022_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Set up MSVC environment (for Ninja)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies (ffmpeg, pandoc, imagemagick, ninja)
        run: |
          choco install -y --no-progress ffmpeg pandoc imagemagick ninja

      - name: Configure (Debug, with tests)
        run: |
          cmake -S . -B build/debug -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}\Qt\6.12.0\msvc2022_64" `
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build/debug --parallel

      - name: ctest
        working-directory: build/debug
        run: |
          # test_runner writes detail to test_results.log and can die at
          # startup (missing DLL etc.) with ctest swallowing the cause;
          # run it directly first so its exit code and stdout are visible.
          & ".\tests\test_runner.exe"
          Write-Host "direct-run exit: $LASTEXITCODE"
          ctest --output-on-failure
          $ctest = $LASTEXITCODE
          if (Test-Path tests\test_results.log) {
            Write-Host "===== tests\test_results.log ====="
            Get-Content tests\test_results.log
          }
          exit $ctest
