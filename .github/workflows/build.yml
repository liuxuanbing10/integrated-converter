name: build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  windows-msvc:
    name: windows / MSVC / Qt 6.12
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Set up MSVC environment (for Ninja)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies (ffmpeg, pandoc, imagemagick, ninja)
        run: |
          choco install -y --no-progress ffmpeg pandoc imagemagick ninja

      - name: Configure (Debug, with tests)
        run: |
          cmake -S . -B build/debug -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug `
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build/debug --parallel

      - name: ctest
        working-directory: build/debug
        run: ctest --output-on-failure
